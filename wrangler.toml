# WAVE AI — Cloudflare Workers + D1.
# Deploy via the API helper (no wrangler auth needed):
#   python3 scripts/cloudflare_api_deploy.py
# (It creates the D1 database, uploads the bundled Worker, and sets the
# secrets.) Or connect this repo in the Cloudflare dashboard, or run
# `npx wrangler deploy` — but first replace the database_id placeholder
# below with the real ID (npx wrangler d1 create wave-ai-db).
# Secrets (set via the helper, dashboard, or wrangler — never here):
#   SESSION_SECRET, ADMIN_EMAIL
#
# The frontend in public/ is bundled into the script by
# scripts/build-assets.mjs (part of `npm run build`) — there is no
# [assets] section because the Workers Script Upload API cannot take
# static assets.

name = "wave-ai"
main = "src/index.js"
compatibility_date = "2026-11-20"

[[d1_databases]]
binding = "DB"
database_name = "wave-ai-db"
database_id = "PLACEHOLDER-REPLACE-AFTER-D1-CREATED"

[vars]
AI_BASE_URL = "https://text.pollinations.ai/openai"
AI_MODEL = "openai-fast"
PRO_PRICE_PHP = "149"
FREE_DAILY_LIMIT = "20"
