# WAVE AI — Cloudflare Workers + D1.
# Deploy: connect this repo in the Cloudflare dashboard (Workers & Pages >
# Create > Workers > Import a repository), or run `npx wrangler deploy`.
# Before the first deploy, create the D1 database and replace the
# database_id placeholder below with the real ID:
#   npx wrangler d1 create wave-ai-db
# Secrets (set in the dashboard, never in this file):
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put ADMIN_EMAIL

name = "wave-ai"
main = "src/index.js"
compatibility_date = "2026-11-20"

# The frontend in public/ is served unchanged as static assets.
# The explicit binding makes env.ASSETS available to the Worker so it can
# serve the clean page URLs (/login -> auth.html, etc.).
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "wave-ai-db"
database_id = "PLACEHOLDER-REPLACE-AFTER-D1-CREATED"

[vars]
AI_BASE_URL = "https://text.pollinations.ai/openai"
AI_MODEL = "openai-fast"
PRO_PRICE_PHP = "149"
FREE_DAILY_LIMIT = "20"
